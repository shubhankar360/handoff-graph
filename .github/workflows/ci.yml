name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # the committed scenarios and report must match a fresh run
      - run: python data/build.py && git diff --exit-code data/
      - run: python -m handoff_graph eval > /dev/null && git diff --exit-code results/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t handoff-graph .
      - run: |
          docker run -d -p 8000:8000 --name hg handoff-graph
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS -X POST localhost:8000/chat -H 'content-type: application/json' \
            -d '{"thread_id":"ci","message":"My card was stolen. ben@example.com, born 1987-11-02"}' | grep -q frozen
